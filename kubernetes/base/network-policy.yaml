apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platformops-default-deny
  namespace: platformops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platformops
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platformops
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
