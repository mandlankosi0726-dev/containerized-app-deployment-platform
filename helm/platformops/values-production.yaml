replicaCount: 3
image:
  repository: ghcr.io/OWNER/platformops
  tag: SET_EXPLICIT_RELEASE_TAG
  pullPolicy: IfNotPresent
config:
  environment: production
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
networkPolicy:
  enabled: true
