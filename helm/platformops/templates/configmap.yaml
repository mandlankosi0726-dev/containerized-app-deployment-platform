apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platformops.fullname" . }}-config
  labels:
    {{- include "platformops.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  BUILD_REVISION: {{ .Values.config.buildRevision | quote }}
  BUILD_DATE: {{ .Values.config.buildDate | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
